name: Referências do vídeo (022)

# Gera, no Linux do CI, os vídeos e quadros de referência da Feature 022 (T039) e mede o
# render (tempos e SSIM do último quadro × card). Os quadros de referência só valem na
# plataforma em que foram gerados (tests/video/test_quadros.py); este workflow é a forma de
# regenerá-los para o CI quando o template ou o card mudarem. Manual (workflow_dispatch), ou
# automático num push que altere este arquivo. Não publica nada: os resultados ficam num
# artefato do workflow, para serem revisados e versionados.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/referencias-video.yml

permissions:
  contents: read

jobs:
  referencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --extra dev --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci --prefix video
      - uses: actions/cache@v4
        with:
          path: video/node_modules/.remotion
          key: navegador-remotion-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}
      - run: npm --prefix video run garantir-navegador
      - name: Gerar referências
        run: uv run python specs/022-minha-trajetoria-video/evidencias/gerar_referencias.py
      - name: Medir render e quadro final no Linux
        run: >-
          uv run pytest -s -p no:cacheprovider
          tests/video/test_midia.py tests/video/test_quadros.py -k "not referencias"
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: referencias-video-022
          path: |
            specs/022-minha-trajetoria-video/evidencias/referencia-*
            specs/022-minha-trajetoria-video/evidencias/referencias-plataforma.txt
          if-no-files-found: error
