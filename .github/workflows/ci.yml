name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trajetoria
          POSTGRES_PASSWORD: trajetoria
          POSTGRES_DB: trajetoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trajetoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciais descartáveis do contêiner de CI; nenhum segredo real.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: trajetoria
      PGPASSWORD: trajetoria
      PGDATABASE: trajetoria
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate
      # 022: renderizador de vídeo (Node + Remotion + Chrome Headless Shell). Sem ele, os
      # testes de mídia falham no CI (CI=true), nunca são pulados (research R14, R15).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: npm ci --prefix video
      # Depois do `npm ci` (que recria node_modules): o Chrome Headless Shell (~190 MB) só é
      # baixado quando a versão do Remotion muda.
      - uses: actions/cache@v4
        with:
          path: video/node_modules/.remotion
          key: navegador-remotion-${{ runner.os }}-${{ hashFiles('video/package-lock.json') }}
      - run: npm --prefix video run garantir-navegador
      - run: uv run pytest
        env:
          CI: "true"
